name: "Daily Build"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'
env:
  QUARKUS_BUILD: 3.39.999-SNAPSHOT
jobs:
  linux-build-jvm-latest:
    name: Linux JVM
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]
        profiles: [ "http-modules,security-modules,spring-modules",
                   "messaging-modules,websockets-modules,monitoring-modules,cache-modules,test-tooling-modules,nosql-db-modules,ai-modules"]
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh
      - name: Install JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
      - uses: ./.github/actions/use-docker-mirror
      - name: Install Maven settings
        run: cp .github/mvn-settings.xml ~/.m2/settings.xml
      - name: Test in JVM mode
        run: |
          mvn -fae -V -B -nsu --no-transfer-progress clean verify -P ${{ matrix.profiles }} -Dinclude.quarkus-cli-tests -Dts.quarkus.cli.cmd="${PWD}/quarkus-dev-cli"
      - uses: ./.github/actions/zip-and-archive
        name: Zip and archive artifacts
        if: failure()
        with:
          java: '${{ matrix.java }}'
          os: 'linux'
          profiles: '${{ matrix.profiles }}'
          mode: 'jvm'
