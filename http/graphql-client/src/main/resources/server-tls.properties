quarkus.tls.server.key-store.p12.path=certificates/server-keystore.p12
quarkus.tls.server.key-store.p12.password=password

quarkus.tls.server.trust-store.p12.path=certificates/server-truststore.p12
quarkus.tls.server.trust-store.p12.password=password

quarkus.http.tls-configuration-name=server
quarkus.http.ssl.client-auth=required
quarkus.http.insecure-requests=enabled
